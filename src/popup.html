<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>NS Field Explorer</title>

    <link
      rel="stylesheet"
      type="text/css"
      href="lib/json-formatter-js/json-formatter-js.min.css"
    />
    <link rel="stylesheet" type="text/css" href="css/popup.css" />
  </head>

  <body class="theme-light">
    <div class="app">
      <!-- ===== Hero ===== -->
      <header class="hero">
        <div class="hero-watermark" aria-hidden="true">
          <svg
            width="150"
            height="150"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#fff"
            stroke-width="1.3"
          >
            <circle cx="10.5" cy="10.5" r="6.5" />
            <line x1="15.5" y1="15.5" x2="21" y2="21" stroke-linecap="round" />
          </svg>
        </div>

        <div class="hero-top">
          <div class="brand">
            <div class="mark">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="#fff"
                stroke-width="2.2"
              >
                <circle cx="10.5" cy="10.5" r="6.5" />
                <line
                  x1="15.5"
                  y1="15.5"
                  x2="21"
                  y2="21"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="brand-text">
              <h1>NS Field Explorer</h1>
              <p>by DLC for NetSuite Internal Purposes</p>
            </div>
          </div>

          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            title="Toggle light / dark"
            aria-label="Toggle light or dark mode"
          >
            <!-- sun (shown in dark mode) -->
            <svg
              class="ic-sun"
              width="17"
              height="17"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <circle cx="12" cy="12" r="4.2" />
              <line x1="12" y1="2.5" x2="12" y2="5" />
              <line x1="12" y1="19" x2="12" y2="21.5" />
              <line x1="2.5" y1="12" x2="5" y2="12" />
              <line x1="19" y1="12" x2="21.5" y2="12" />
              <line x1="5.2" y1="5.2" x2="6.9" y2="6.9" />
              <line x1="17.1" y1="17.1" x2="18.8" y2="18.8" />
              <line x1="5.2" y1="18.8" x2="6.9" y2="17.1" />
              <line x1="17.1" y1="6.9" x2="18.8" y2="5.2" />
            </svg>
            <!-- moon (shown in light mode) -->
            <svg
              class="ic-moon"
              width="16"
              height="16"
              viewBox="0 0 24 24"
              fill="currentColor"
              stroke="none"
            >
              <path d="M20 14.5A8.2 8.2 0 0 1 9.5 4 8.3 8.3 0 1 0 20 14.5z" />
            </svg>
          </button>
        </div>

        <div class="meta" id="record-meta">
          <div class="meta-item">
            <span class="lbl">Record Type</span>
            <span class="val" id="meta-type">&mdash;</span>
          </div>
          <div class="meta-item">
            <span class="lbl">Internal ID</span>
            <span class="val red" id="meta-id">&mdash;</span>
          </div>
        </div>
      </header>

      <!-- ===== Toolbar ===== -->
      <div id="toolbar">
        <div class="search">
          <svg
            class="search-ic"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="10.5" cy="10.5" r="6.5" />
            <line x1="15.5" y1="15.5" x2="21" y2="21" stroke-linecap="round" />
          </svg>
          <input id="searchbox" placeholder="Filter fields&hellip;" />
        </div>

        <button
          id="expand-all"
          class="icbtn"
          type="button"
          title="Expand all"
          aria-label="Expand all"
          disabled
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="7 9 12 4 17 9" />
            <polyline points="7 15 12 20 17 15" />
          </svg>
        </button>
        <button
          id="collapse-all"
          class="icbtn"
          type="button"
          title="Collapse all"
          aria-label="Collapse all"
          disabled
        >
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polyline points="7 5 12 10 17 5" />
            <polyline points="7 19 12 14 17 19" />
          </svg>
        </button>
        <button
          id="copy-all"
          class="icbtn primary"
          type="button"
          title="Copy all"
          aria-label="Copy all"
          disabled
        >
          <svg
            width="15"
            height="15"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="9" y="9" width="11" height="11" rx="2" />
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
          </svg>
        </button>
        <span id="copy-status" aria-live="polite"></span>
      </div>

      <!-- ===== Tabs ===== -->
      <div id="tabs" role="tablist">
        <button
          class="tab on"
          id="tab-all"
          type="button"
          role="tab"
          data-scope="all"
          disabled
        >
          All<span class="count" id="count-all"></span>
        </button>
        <button
          class="tab"
          id="tab-body"
          type="button"
          role="tab"
          data-scope="body"
          disabled
        >
          Body fields<span class="count" id="count-body"></span>
        </button>
        <button
          class="tab"
          id="tab-line"
          type="button"
          role="tab"
          data-scope="line"
          disabled
        >
          Line items<span class="count" id="count-line"></span>
        </button>
      </div>

      <!-- ===== Body ===== -->
      <div class="body">
        <div class="card">
          <div id="container">
            <div class="loading">
              <span class="spinner" aria-hidden="true"></span>
              Loading record&hellip;
            </div>
          </div>
        </div>
      </div>

      <!-- ===== Footer ===== -->
      <footer id="links">
        <span id="records_browser">
          <a href="#" target="_blank" rel="noreferrer">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14 4h6v6" />
              <path d="M20 4l-9 9" />
              <path
                d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"
              />
            </svg>
            Records Browser
          </a>
        </span>
        <span id="records_catalog">
          <a href="#" target="_blank" rel="noreferrer">
            <svg
              width="13"
              height="13"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M14 4h6v6" />
              <path d="M20 4l-9 9" />
              <path
                d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"
              />
            </svg>
            Records Catalog
          </a>
        </span>
      </footer>
    </div>

    <script src="lib/x2js/x2js.js"></script>
    <script src="lib/lodash/lodash.min.js"></script>
    <script src="lib/json-formatter-js/json-formatter-js.min.js"></script>
    <script src="js/popup.js"></script>
  </body>
</html>
